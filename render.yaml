services:
  - type: web
    name: cine-scope-movie-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: "gunicorn --bind 0.0.0.0:$PORT webapp:app"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
