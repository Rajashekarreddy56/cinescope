services:
  - type: web
    name: cine-scope-movie-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: gunicorn webapp:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TMDB_BEARER_TOKEN
        sync: false
